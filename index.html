<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penugasan & Penomoran Surat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SweetAlert2 untuk Notifikasi Modern -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">

    <!-- BAGIAN 1: KONTEN APLIKASI UTAMA (MUNCUL SETELAH WAKTU HABIS) -->
    <div id="mainAppContainer" class="w-full h-full hidden flex-col">
        <iframe src="https://script.google.com/macros/s/AKfycbyXoxGhWe1muwhj4m9HNVeEfHmXu4ud4yMssiHEhIqIXv7Fd1zs1TBzW8N2LNx-OOQL/exec" 
                class="w-full h-full border-none" 
                title="Sistem Penugasan"></iframe>
    </div>

    <!-- BAGIAN 2: HALAMAN HITUNG MUNDUR (MUNCUL SETELAH LOGIN, SEBELUM WAKTU HABIS) -->
    <div id="countdownSection" class="max-w-md w-full space-y-6 text-center p-6 hidden">
        <div class="space-y-2">
            <h1 class="text-4xl font-extrabold tracking-tight text-white">Segera Hadir</h1>
            <p class="text-sm text-slate-400">Website kami sedang dalam tahap pemeliharaan. Silakan kembali lagi nanti!</p>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 shadow-xl backdrop-blur">
            <p class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-3">Pemeliharaan akan berakhir dalam:</p>
            <div id="countdown" class="text-2xl font-mono font-bold text-white tracking-widest">
                Memuat waktu...
            </div>
        </div>
        <div>
            <button onclick="logoutAdmin()" class="text-xs text-slate-500 hover:text-slate-300 underline cursor-pointer">Kunci Kembali Halaman</button>
        </div>
    </div>

    <!-- BAGIAN 3: FORM LOGIN PASSWORD (MUNCUL PERTAMA KALI) -->
    <div id="loginSection" class="max-w-sm w-full bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-2xl backdrop-blur space-y-4 m-auto">
        <div class="space-y-1 text-center">
            <div class="bg-blue-600/20 w-12 h-12 mx-auto rounded-xl flex items-center justify-center border border-blue-500/30 text-blue-400 mb-2">
                <span class="text-lg">🔑</span>
            </div>
            <h2 class="font-bold text-base text-white">Akses Terbatas</h2>
            <p class="text-xs text-slate-400">Masukkan kata sandi untuk melihat halaman.</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-3">
            <input type="password" id="adminPassword" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-center tracking-widest" placeholder="Kata Sandi..." required autocomplete="current-password">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-xl shadow transition cursor-pointer text-xs uppercase tracking-wider">
                Masuk
            </button>
        </form>
    </div>

    <!-- Skrip Logika Lengkap + Idle Timeout -->
    <script>
        const PASSWORD_RAHASIA = "osdm321";
        
        // PENGATUR WAKTU IDLE (Dalam Milidetik)
        // Contoh di bawah diset 15 menit (15 * 60 * 1000 milidetik)
        // Anda bisa mengubahnya, misal 30 menit = 30 * 60 * 1000
        const IDLE_TIMEOUT_LIMIT = 15 * 60 * 1000; 
        let idleTimer;

        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                cekWaktuDanTampilkan();
                mulaiPengingatIdle();
            }
        };

        function handleLogin(e) {
            e.preventDefault();
            const inputPwd = document.getElementById("adminPassword").value;

            if (inputPwd === PASSWORD_RAHASIA) {
                localStorage.setItem("isLoggedIn", "true");
                cekWaktuDanTampilkan();
                mulaiPengingatIdle();
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal!',
                    text: 'Kata sandi salah, silakan coba lagi.',
                    background: '#1e293b',
                    color: '#f8fafc',
                    confirmButtonColor: '#2563eb'
                });
                document.getElementById("adminPassword").value = "";
            }
        }

        function cekWaktuDanTampilkan() {
            document.getElementById("loginSection").classList.add("hidden");
            
            const countDownDate = new Date("2026-09-12T01:32:00+07:00").getTime();
            const now = new Date().getTime();
            const distance = countDownDate - now;

            if (distance < 0) {
                tampilkanAplikasiUtama();
            } else {
                document.getElementById("countdownSection").classList.remove("hidden");
                mulaiHitungMundur(countDownDate);
            }
        }

        function mulaiHitungMundur(countDownDate) {
            const x = setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if (distance < 0) {
                    clearInterval(x);
                    document.getElementById("countdown").innerHTML = "MEMBUKA APLIKASI...";
                    setTimeout(() => {
                        tampilkanAplikasiUtama();
                    }, 1000);
                } else {
                    let displayTime = "";
                    if (days > 0) displayTime += `${days} hari, `;
                    displayTime += `${hours} jam, ${minutes} menit, ${seconds} detik`;
                    document.getElementById("countdown").innerHTML = displayTime;
                }
            }, 1000);
        }

        function tampilkanAplikasiUtama() {
            document.getElementById("countdownSection").classList.add("hidden");
            const container = document.getElementById("mainAppContainer");
            container.classList.remove("hidden");
            container.classList.add("flex");
        }

        function logoutAdmin() {
            localStorage.removeItem("isLoggedIn");
            location.reload();
        }

        // --- SISTEM PENGAMANAN IDLE (TIDAK AKTIF) ---
        function mulaiPengingatIdle() {
            // Daftar event aktivitas pengguna
            const events = ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll'];

            // Fungsi untuk mereset timer setiap kali ada aktivitas
            function resetIdleTimer() {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(terdeteksiIdle, IDLE_TIMEOUT_LIMIT);
            }

            // Daftarkan listener ke seluruh halaman
            events.forEach(event => {
                window.addEventListener(event, resetIdleTimer, true);
            });

            // Jalankan timer pertama kali
            resetIdleTimer();
        }

        function terdeteksiIdle() {
            // Hapus sesi login dan muat ulang halaman ke menu password
            localStorage.removeItem("isLoggedIn");
            
            Swal.fire({
                icon: 'warning',
                title: 'Sesi Berakhir',
                text: 'Anda tidak aktif dalam waktu yang lama. Silakan masuk kembali.',
                background: '#1e293b',
                color: '#f8fafc',
                confirmButtonColor: '#2563eb',
                allowOutsideClick: false,
                allowEscapeKey: false
            }).then(() => {
                location.reload();
            });
        }
    </script>
</body>
</html>
