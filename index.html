<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segera Hadir - Sistem Penugasan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="max-w-md w-full space-y-6">
        <div class="space-y-2">
            <h1 class="text-4xl font-extrabold tracking-tight text-white">Segera Hadir</h1>
            <p class="text-sm text-slate-400">Website kami sedang dalam tahap pemeliharaan. Silakan kembali lagi nanti!</p>
        </div>

        <!-- Wadah Hitung Mundur -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 shadow-xl backdrop-blur">
            <p class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-3">Pemeliharaan akan berakhir dalam:</p>
            <div id="countdown" class="text-2xl font-mono font-bold text-white tracking-widest">
                Memuat waktu...
            </div>
        </div>
    </div>

 <!-- Skrip Hitung Mundur & Auto Redirect -->
    <script>
        // Tentukan Waktu Berakhir: Format (Tahun-Bulan-Tanggal Jam:Menit:Detik) dengan Zona Waktu WIB (+07:00)
        const countDownDate = new Date("2026-09-14T08:00:00+07:00").getTime();

        // URL Web App Google Apps Script Anda
        const targetAppUrl = "https://script.google.com/macros/s/AKfycbjykPVAzg9CgGvWPFtNuNYIGBUCUV1zwvU4bSRcGx9BnMAyb1GZVi-NM9M1HboeOKRS/exec";

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            // Perhitungan akurat untuk Hari, Jam, Menit, dan Detik
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Tampilkan hasilnya di elemen dengan id="countdown"
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "MEMBUKA APLIKASI...";
                
                // Langsung arahkan ke aplikasi utama setelah 1 detik
                setTimeout(() => {
                    window.location.href = targetAppUrl;
                }, 1000);
            } else {
                // Tampilkan hari jika durasinya masih berhari-hari
                let displayTime = "";
                if (days > 0) {
                    displayTime += `${days} hari, `;
                }
                displayTime += `${hours} jam, ${minutes} menit, ${seconds} detik`;
                
                document.getElementById("countdown").innerHTML = displayTime;
            }
        }, 1000);
    </script>
